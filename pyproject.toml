[project]
name = "seeing-weight"
version = "0.1.0"
description = "Can a small physics-trained model beat foundation models at weighing a ball from video?"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "opencv-python",
    "torch",
]

[dependency-groups]
dev = ["pytest", "ruff", "jupyter"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seeing_weight"]

[tool.ruff]
line-length = 100
